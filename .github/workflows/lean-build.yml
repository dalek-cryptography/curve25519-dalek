name: Lean build

# Build all Lean libraries and run the linter.

on:
  push:
    branches: [ '**' ]
    paths: &paths
      - 'curve25519-dalek/lean/**'
      - '.github/workflows/lean-build.yml'
  pull_request:
    branches: [ '**' ]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ELAN_VERSION: v4.2.4

# The Lean project
defaults:
  run:
    working-directory: curve25519-dalek/lean

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7.0.1

      # elan at a pinned release
      - name: Install elan
        run: |
          curl -sSfL -o elan.tar.gz \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz"
          tar xzf elan.tar.gz
          ./elan-init -y --default-toolchain none
          rm elan-init elan.tar.gz
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Cache: project build, and the Aeneas and EllipticCurve packages (built here). Mathlib and its
      # dependencies come from Mathlib's cache.
      - name: Restore build cache
        id: cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: &cache-paths |
            curve25519-dalek/lean/.lake/build
            curve25519-dalek/lean/.lake/packages/aeneas
            curve25519-dalek/lean/.lake/packages/EllipticCurve
          key: &cache-key lean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('curve25519-dalek/lean/lean-toolchain', 'curve25519-dalek/lean/lake-manifest.json') }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            lean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('curve25519-dalek/lean/lean-toolchain', 'curve25519-dalek/lean/lake-manifest.json') }}-${{ github.ref_name }}-
            lean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('curve25519-dalek/lean/lean-toolchain', 'curve25519-dalek/lean/lake-manifest.json') }}-
            lean-build-${{ runner.os }}-${{ runner.arch }}-

      - name: Pinned Aeneas matches AENEAS_VERSION.txt
        run: |
          want=$(tr -d '[:space:]' < AENEAS_VERSION.txt)
          got=$(python3 -c "import json;print([p['inputRev'] for p in json.load(open('lake-manifest.json'))['packages'] if p['name']=='aeneas'][0])")
          if [ "$want" != "$got" ]; then
            echo "AENEAS_VERSION.txt is '$want' but lake-manifest.json pins '$got'."
            echo "Refresh it with: rm -rf .lake/config && lake update aeneas"
            exit 1
          fi

      # The per-configuration copies in `Specs/` are generated from their templates.
      - name: Check generated specs
        run: python3 scripts/gen-config-specs.py --check

      - name: Mathlib cache
        run: lake exe cache get

      # Not strict: Lake logs warnings.
      - name: Aeneas
        run: lake build Aeneas

      # Strict: warnings are errors.
      - name: Build
        id: build
        run: lake build --wfail

      # Saved even when the build fails: Lake rebuilds only what changed.
      - name: Save build cache
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: *cache-paths
          key: *cache-key

      # Keep only the newest build cache of this branch or pull request
      - name: Delete superseded build caches
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: lean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('curve25519-dalek/lean/lean-toolchain', 'curve25519-dalek/lean/lake-manifest.json') }}-${{ github.ref_name }}-${{ github.sha }}
        run: |
          gh cache list --ref "$GITHUB_REF" --key lean-build- --limit 100 --json id,key \
            --jq 'if any(.[]; .key == env.KEY) then .[] | select(.key != env.KEY) | .id else empty end' |
            xargs -r -n1 gh cache delete

      - name: Lint ForHumans
        if: ${{ !cancelled() }}
        run: lake exe runLinter ForHumans
      - name: Lint Proofs
        if: ${{ !cancelled() }}
        run: lake exe runLinter Proofs
